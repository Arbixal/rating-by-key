# This workflow validates, builds, and deploys the static Vite application.

name: Node.js CI

on:
  push:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # React Router 8 requires Node >=22.22.0; use the current Active LTS line.

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint
    - name: Test
      run: npm test
    - name: Build
      run: npm run build
    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium
    - name: Browser tests
      run: npm run test:e2e
    - name: Store Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: build

  deploy_aws:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: package
        path: build
        
    - name: Configure AWS Credentials  
      uses: aws-actions/configure-aws-credentials@v6
      with: 
          # Created the Secrets Under the Repo only with These Variables
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} 
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2 #--> Define Region of the AWS-CLI 
          
    - name: Deploy to S3
      run: |
        aws s3 cp ./build s3://rating-by-key-files/ --recursive
        aws cloudfront create-invalidation --distribution-id EVFW8L8ZQX152 --paths "/index.html"
